<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MemorySQL 上游监控看板</title>
<style>
/* ============================================================
   浅色主题 —— 独立于产品(Electron 应用是深色液态玻璃)。
   看板是长时间盯的工具:浅底降低眩光,高对比强调「有问题」的行。
   ============================================================ */
:root{
  --bg:#f7f8fa; --surface:#fff; --surface-2:#fafbfc;
  --border:#e4e7ec; --border-strong:#d0d5dd;
  --fg:#1a202c; --fg-2:#475467; --fg-3:#8a94a6;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --high:#d92d20; --high-soft:#fef3f2;
  --med:#b54708; --med-soft:#fffaeb;
  --low:#475467; --ok:#067647; --ok-soft:#ecfdf3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --radius:10px;
  --mono:'JetBrains Mono','Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
  padding:28px 32px 60px;max-width:1400px;margin-inline:auto;
}
h1{font-size:19px;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}
.sub{color:var(--fg-3);font-size:13px;margin-bottom:20px}
.sub b{color:var(--fg-2);font-weight:600}

/* 顶部:概览 + 操作 */
.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;
     flex-wrap:wrap;margin-bottom:18px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:9px 14px;box-shadow:var(--shadow);min-width:88px}
.stat .n{font-size:20px;font-weight:650;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--fg-3);margin-top:1px}
.stat.high .n{color:var(--high)} .stat.med .n{color:var(--med)}
.stat.ok .n{color:var(--ok)} .stat.broken .n{color:#6941c6}

button{
  font:inherit;font-size:13px;font-weight:550;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--fg-2);
  padding:8px 15px;border-radius:8px;transition:.14s;
}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:#1d4ed8;color:#fff}

/* 筛选 */
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.chip{
  font-size:12px;font-weight:550;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--fg-2);transition:.14s;
  user-select:none;
}
.chip:hover{border-color:var(--border-strong)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.filters .spacer{flex:1}

/* 卡片 */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
}
.card.attention{border-left:3px solid var(--high)}
.card.warnish{border-left:3px solid var(--med)}
.card.dimmed{opacity:.72}
.rw{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 16px}
.name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--fg-3);font-size:12px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta .dot{opacity:.4}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

.badge{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:.01em;
  border:1px solid transparent;white-space:nowrap;
}
.b-high{color:var(--high);background:var(--high-soft);border-color:#fecdca}
.b-medium{color:var(--med);background:var(--med-soft);border-color:#fedf89}
.b-low{color:var(--fg-2);background:var(--surface-2);border-color:var(--border)}
.b-none{color:var(--fg-3);background:var(--surface-2);border-color:var(--border)}
.b-unknown{color:var(--fg-3);background:transparent;border-color:var(--border-strong);border-style:dashed}
.b-ok{color:var(--ok);background:var(--ok-soft);border-color:#abefc6}
.b-checker{color:#6941c6;background:#f4f3ff;border-color:#d9d6fe}
.b-bb{color:#667085;background:var(--surface-2);border-color:var(--border-strong)}
/* LLM 判定:与白盒(关键词)/黑盒(schema)视觉上区分开 —— 它是「语义判断」,
   权威性低于黑盒,配色刻意更轻,避免看起来比黑盒更可信 */
.b-llmhit{color:#b54708;background:#fff6ed;border-color:#f9dbaf}
.b-llmok{color:#475467;background:var(--surface-2);border-color:var(--border)}
.b-err{color:var(--high);background:var(--high-soft);border-color:#fecdca}

/* LLM 详情条 —— 和 .probe(黑盒条)同一套结构,视觉对称 */
.llmbar{
  margin:0 16px 12px;padding:9px 12px;border-radius:8px;font-size:12.5px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--border);
}
.llmbar .tag{font-weight:650;font-size:11px;color:var(--fg-2);letter-spacing:.02em}
.llmbar .txt{color:var(--fg-2);flex:1;min-width:180px}
.llmbar .sev{color:var(--fg-3);font-size:11px;font-family:var(--mono)}
.llmbar.hit{background:#fffcf5;border-color:#f9dbaf}
.llmbar.err{background:var(--high-soft);border-color:#fecdca}
.llmbar.err .txt{color:#912018}
.llmbar.muted{background:transparent;border-style:dashed}
.llmbar.muted .txt{color:var(--fg-3);font-size:12px}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid}
.pill.good{color:var(--ok);background:var(--ok-soft);border-color:#abefc6}
.pill.bad{color:var(--high);background:var(--high-soft);border-color:#fecdca}

/* ── 总体情况面板 ──────────────────────────────────────────────
   分两层是刻意的:上层「程序统计」是代码算出的事实,下层「LLM 解读」是叙述。
   **两者必须肉眼可分** —— 一旦 LLM 说出和统计矛盾的数字,用户要能当场看见,
   而不是被一段通顺的文字糊弄过去。 */
.summary{
  margin:0 0 18px;border:1px solid var(--border-strong);border-radius:12px;
  background:var(--surface);overflow:hidden;
}
.summary.hot{border-color:#f9dbaf;box-shadow:inset 3px 0 0 #f79009}
.summary .sh{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);
}
.summary .sh .t{font-weight:650;font-size:13px;letter-spacing:.02em}
.summary .sb{padding:14px 16px}
.summary .facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.summary .fact{
  font-size:12px;padding:3px 9px;border-radius:5px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--fg-2);
  font-variant-numeric:tabular-nums;
}
.summary .fact b{color:var(--fg);font-weight:650}
.summary .fact.warn{color:#b54708;background:#fff6ed;border-color:#f9dbaf}
.summary .fact.bad{color:var(--high);background:var(--high-soft);border-color:#fecdca}
.summary .fact.good{color:var(--ok);background:var(--ok-soft);border-color:#abefc6}
.summary .hl{font-size:15px;line-height:1.65;font-weight:600;margin-bottom:10px}
.summary .note{font-size:12.5px;color:var(--fg-2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.summary .acts{margin:8px 0 0;padding-left:0;list-style:none}
.summary .acts li{
  font-size:13px;line-height:1.6;padding:5px 0 5px 22px;position:relative;color:var(--fg);
}
.summary .acts li::before{
  content:'';position:absolute;left:6px;top:12px;width:5px;height:5px;
  border-radius:50%;background:var(--msql-accent,#1570ef);
}
.summary .blind{
  margin-top:12px;padding:9px 12px;border-radius:7px;font-size:12.5px;line-height:1.6;
  background:#fffaeb;border:1px solid #f9dbaf;color:#93370d;
}
.summary .blind .k{font-weight:650;display:block;margin-bottom:2px}
.summary .stamp{font-size:11px;color:var(--fg-3);font-family:var(--mono)}
/* LLM 未启用/失败:虚线弱提示,别让它看起来像"没有风险" */
.summary.warn{border-style:dashed}
.summary.warn .sb{color:var(--fg-2);font-size:13px;line-height:1.65}
.attn{
  margin-top:10px;font-size:12.5px;border-top:1px dashed var(--border);padding-top:10px;
}
.attn .r{display:flex;gap:8px;align-items:baseline;padding:3px 0;flex-wrap:wrap}
.attn .r .id{font-family:var(--mono);font-weight:600;font-size:12px}
.attn .r .rs{color:#b54708;font-size:11.5px}

/* 契约一致性警告:白盒在云端算、黑盒在开发机算,两边各带一份台账副本。
   不一致时「漂移」结论可能只是台账版本差 —— 而那个判断会直接触发一次发版,
   所以用最高一档的警示样式,不容错过。 */
.ledger-warn{
  margin:0 16px 14px;padding:12px 14px;border-radius:9px;
  background:var(--high-soft);border:1px solid #fecdca;color:#912018;
  font-size:13px;line-height:1.65;
}
.ledger-warn .k{font-weight:700;display:block;margin-bottom:4px;font-size:13.5px}
.ledger-warn code{background:#fee4e2;padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:11.5px;font-weight:600}
.ledger-ok{font-size:11.5px;color:var(--fg-3);font-family:var(--mono);padding:0 16px 10px}

/* 黑盒条 */
.probe{
  margin:0 16px 12px;padding:9px 12px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;font-size:12.5px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;
}
.probe .tag{font-weight:650;font-size:11px;color:var(--fg-2);letter-spacing:.02em}
.probe .txt{color:var(--fg-2);font-family:var(--mono);font-size:11.5px;word-break:break-all}

.notes{
  margin:0 16px 14px;padding:10px 12px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;
  font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--fg-2);
  white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto;
}
.hits{padding:0 16px 12px;font-size:12px;color:var(--fg-2)}
.hits code{font-family:var(--mono);font-size:11px;background:var(--surface-2);
           padding:1px 5px;border-radius:4px;border:1px solid var(--border);margin-right:4px}
.act{padding:0 16px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act .hint{color:var(--fg-3);font-size:12px;flex:1;min-width:200px}
textarea{
  width:100%;min-height:78px;margin:0 16px 8px;padding:9px 11px;
  border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-2);
  color:var(--fg);font:12px/1.5 var(--mono);resize:vertical;
}
textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--fg-3)}
@media (max-width:720px){
  body{padding:20px 16px 48px}
  .stat{min-width:72px;padding:8px 11px}
  .stat .n{font-size:18px}
}
</style>
</head>
<body>

<h1>MemorySQL 上游监控</h1>
<div class="sub" id="sub">加载中…</div>

<div id="summary"></div>

<div class="top">
  <div class="stats" id="stats"></div>
  <button class="primary" id="refresh">立即刷新</button>
</div>

<div class="filters" id="filters">
  <span class="chip" data-f="all" aria-pressed="true">全部</span>
  <span class="chip" data-f="attention" aria-pressed="false">只看需处理</span>
  <span class="chip" data-f="drift" aria-pressed="false">黑盒漂移</span>
  <span class="chip" data-f="bb" aria-pressed="false">闭源</span>
  <span class="chip" data-f="llm" aria-pressed="false">LLM 判有影响</span>
  <span class="chip" data-f="absent" aria-pressed="false">本机未装</span>
  <span class="spacer"></span>
  <span id="probetime" style="font-size:12px;color:var(--fg-3)"></span>
</div>

<div id="list"></div>

<script>
const $ = (s) => document.querySelector(s);
const tok = new URLSearchParams(location.search).get('token') ?? localStorage.getItem('msql_token') ?? '';
const H = tok ? { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
const U = (p) => p + (tok ? '?token=' + encodeURIComponent(tok) : '');

let STATE = { results: [], probe: null };
let FILTER = 'all';

const RISK_LABEL = { high:'高', medium:'中', low:'低', none:'无信号', unknown:'无法评估' };
const VERDICT = {
  ok:            ['b-ok','匹配'],
  drift:         ['b-high','漂移'],
  checker_error: ['b-checker','检查器故障'],
  absent:        ['b-none','本机未装'],
  blackbox_only: ['b-bb','仅黑盒']
};
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  try {
    const r = await fetch(U('/api/state'), { headers: H });
    if (r.status === 401) { $('#sub').innerHTML = '鉴权失败 —— 若经 nginx 访问应无需 token;直连请带 <code>?token=</code>'; return; }
    STATE = await r.json();
  } catch (e) { $('#sub').textContent = '加载失败:' + e.message; return; }
  render();
}

function stats() {
  const R = STATE.results || [], P = STATE.probe?.results || [];
  const L = R.map(llmState);
  const counts = {
    high: R.filter(x => x.risk === 'high').length,
    med:  R.filter(x => x.risk === 'medium').length,
    ok:   R.filter(x => x.risk === 'low' || x.risk === 'none').length,
    unk:  R.filter(x => x.risk === 'unknown').length,
    drift:P.filter(x => x.verdict === 'drift').length,
    broken: P.filter(x => x.verdict === 'checker_error').length,
    llmHit: L.filter(s => s.kind === 'hit').length,
    llmErr: L.filter(s => s.kind === 'err').length,
    llmOn:  L.filter(s => s.kind === 'hit' || s.kind === 'clear').length
  };
  const cells = [
    ['high', counts.high, '白盒高风险', 'high'],
    ['med',  counts.med,  '白盒中风险', 'med'],
    ['ok',   counts.ok,   '无风险信号', 'ok'],
    ['unk',  counts.unk,  '无法评估', ''],
    ['drift',counts.drift,'黑盒漂移', 'high'],
    ['broken',counts.broken,'检查器故障','broken']
  ];
  let html = cells
    .filter(c => c[0] !== 'drift' && c[0] !== 'broken' || P.length)
    .map(c => `<div class="stat ${c[3]}"><div class="n">${c[1]}</div><div class="l">${c[2]}</div></div>`)
    .join('');
  // LLM 统计:未启用时不显示这一组,避免"0"被误读成"跑了但没问题"
  if (counts.llmOn || counts.llmErr) {
    html += `<div class="stat ${counts.llmHit ? 'med' : ''}"><div class="n">${counts.llmHit}</div><div class="l">LLM 判有影响</div></div>`;
    if (counts.llmErr) html += `<div class="stat high"><div class="n">${counts.llmErr}</div><div class="l">LLM 调用失败</div></div>`;
  }
  $('#stats').innerHTML = html;
}

function probeBar(id) {
  const p = (STATE.probe?.results || []).find(x => x.id === id);
  if (!p) return '';
  const [cls, label] = VERDICT[p.verdict] || ['b-none', p.verdict];
  return `<div class="probe">
    <span class="tag">黑盒</span>
    <span class="badge ${cls}">${label}</span>
    <span class="txt">${esc(p.detail)}</span>
  </div>`;
}

/**
 * LLM 判定块 —— 必须区分**四种状态**,混在一起会让人误读:
 *   1. 有判定        LLM 认为有影响
 *   2. 有判定但无害  LLM 认为无影响
 *   3. 调用失败      已自动降级为纯规则(不影响看板工作)
 *   4. 未调用        规则判 low/none 时按设计跳过(省 token)
 *   5. 未启用        服务端没配 LLM_API_KEY
 * 3/4/5 长得不一样,因为它们对使用者的含义完全不同。
 */
function llmState(r) {
  if (r.llm) {
    const hit = r.llm.affectsCapture || r.llm.affectsMcp;
    return { kind: hit ? 'hit' : 'clear', label: hit ? 'LLM 有影响' : 'LLM 无影响', v: r.llm }
  }
  if (r.llmError) return { kind: 'err', label: 'LLM 失败' }
  if (r.risk === 'low' || r.risk === 'none') return { kind: 'skip', label: 'LLM 未调用' }
  return { kind: 'off', label: 'LLM 未启用' }
}

function llmBlock(r) {
  const s = llmState(r);
  if (s.kind === 'off' || s.kind === 'skip') {
    // 弱提示,不占版面 —— 但要能区分「没配」和「按设计跳过」
    return `<div class="llmbar muted"><span class="tag">LLM</span><span class="txt">${
      s.kind === 'off' ? '服务端未配置 LLM_API_KEY,纯规则模式' : '规则判为低风险,按设计不调用(省 token)'
    }</span></div>`;
  }
  if (s.kind === 'err') {
    return `<div class="llmbar err"><span class="tag">LLM</span>
      <span class="badge b-err">调用失败</span>
      <span class="txt">${esc(r.llmError)} —— 已自动降级为纯规则,看板其余部分不受影响</span></div>`;
  }
  const v = s.v;
  const bits = [
    `<span class="pill ${v.affectsCapture ? 'bad' : 'good'}">捕获${v.affectsCapture ? '受影响' : '无影响'}</span>`,
    `<span class="pill ${v.affectsMcp ? 'bad' : 'good'}">MCP${v.affectsMcp ? '受影响' : '无影响'}</span>`
  ].join('');
  return `<div class="llmbar ${s.kind}">
    <span class="tag">LLM</span>
    <span class="badge ${s.kind === 'hit' ? 'b-llmhit' : 'b-llmok'}">${s.label}</span>
    ${bits}
    <span class="txt">${esc(v.reason || '(无理由)')}</span>
    ${v.severity ? `<span class="sev">严重度 ${esc(v.severity)}</span>` : ''}
  </div>`;
}

/**
 * 总体情况面板。
 *
 * 关键:**程序统计与 LLM 解读分成两块显示**。统计是 brief.brief 里的原始数字
 * (由 buildBrief 用代码算出);解读是 LLM 基于同一份 brief 写的话。
 * 如果 LLM 说出与统计矛盾的数字,两块并排就看得见 —— 这是刻意不让它蒙混过关。
 */
function summaryPanel() {
  const S = STATE.summary;
  const b = S?.brief;
  if (!b) return '';

  const hot = b.whitebox.high > 0 || b.blackbox.drift > 0 || b.llm.hit > 0 || b.blackbox.checkerError > 0;

  // ---- 第一层:程序统计(永远可信,与 LLM 无关) ----
  const facts = [];
  facts.push(`<span class="fact">白盒 <b>高 ${b.whitebox.high}</b> · 中 ${b.whitebox.medium} · 无信号 ${b.whitebox.lowOrNone} · 无法评估 ${b.whitebox.unknown}</span>`);
  if (b.llm.hit || b.llm.clear || b.llm.error) {
    facts.push(`<span class="fact${b.llm.hit ? ' warn' : ''}">LLM 判有影响 <b>${b.llm.hit}</b> · 无影响 ${b.llm.clear}${b.llm.error ? ` · 失败 ${b.llm.error}` : ''}</span>`);
  }
  facts.push(b.blackbox.reported
    ? `<span class="fact${b.blackbox.drift ? ' bad' : ''}">黑盒 漂移 <b>${b.blackbox.drift}</b> · 匹配 ${b.blackbox.ok} · 未装/仅黑盒 ${b.blackbox.absent}${b.blackbox.checkerError ? ` · 检查器故障 <b>${b.blackbox.checkerError}</b>` : ''}</span>`
    : `<span class="fact bad">黑盒 <b>尚未上报</b> —— 闭源 agent 的漂移目前无人看守</span>`);
  if (b.fetchErrors.length) facts.push(`<span class="fact bad">抓取失败 <b>${b.fetchErrors.length}</b> 家</span>`);

  // ---- 需要处理的名单(判定来自代码,不是 LLM) ----
  let attn = '';
  if (b.attention.length) {
    attn = '<div class="attn">' + b.attention.map(a =>
      `<div class="r"><span class="id">${esc(a.id)}</span>` +
      `<span class="rs">${esc(a.reasons.join('、'))}</span>` +
      (a.version ? `<span class="rs" style="color:var(--fg-3)">${esc(a.version)}</span>` : '') +
      `</div>`).join('') + '</div>';
  }

  // ---- 第二层:LLM 解读 ----
  let llmPart;
  if (S.headline) {
    llmPart = `<div class="hl">${esc(S.headline)}</div>` +
      (S.actions.length
        ? '<ul class="acts">' + S.actions.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>'
        : '') +
      (S.blindspot
        ? `<div class="blind"><span class="k">当前最大盲区</span>${esc(S.blindspot)}</div>`
        : '') +
      `<div class="stamp">LLM 生成于 ${esc((S.generatedAt || '').slice(0, 16).replace('T', ' '))} · 叙述仅供参考,数字以上方统计为准</div>`;
  } else {
    // 没生成出来要说清是哪一种,否则「空白」会被读成「没风险」
    llmPart = `<div class="sb">${esc(S.error || 'LLM 未生成解读')}</div>`;
  }

  return `<div class="summary${hot ? ' hot' : ''}${S.headline ? '' : ' warn'}">
    <div class="sh"><span class="t">总体情况</span>
      <span class="stamp">${b.total} 家已适配</span></div>
    <div class="sb">
      <div class="facts">${facts.join('')}</div>
      ${ledgerBlock(b.ledger)}
      ${attn}
      ${llmPart}
    </div>
  </div>`;
}

/**
 * 契约一致性条。
 *
 * mismatch → 红色警示,因为此时白盒与黑盒是用**不同的适配契约**算的,
 *   「漂移」结论不可比;而这个判断会直接触发一次适配发版。
 * unknown → 弱提示。旧版探针不上报指纹,那是**未知**不是**冲突**,
 *   报成冲突会让人去排查一个不存在的问题(误报比漏报更消耗信任)。
 * match → 一行灰字,平时不该抢注意力,但出事时能对照。
 */
function ledgerBlock(lg) {
  if (!lg) return '';
  if (lg.state === 'mismatch') {
    return `<div class="ledger-warn">
      <span class="k">⚠ 白盒与黑盒基于不同的适配契约,结论不可比</span>
      云端台账 <code>${esc(lg.server || '未知')}</code> · 上报探针台账 <code>${esc(lg.probe || '未知')}</code>。
      下面的「漂移」可能只是两边台账版本不同,而非上游真的改了格式。
      请先在本机 <code>git pull</code> 同步台账再跑一次 <code>npm run upstream:probe</code>。
    </div>`;
  }
  if (lg.state === 'unknown') {
    return `<div class="ledger-ok">契约指纹:${esc(lg.server || lg.probe || '—')}(另一侧未上报,无法校验是否同源)</div>`;
  }
  return `<div class="ledger-ok">契约指纹 ${esc(lg.server || '')} · 白盒与黑盒同源</div>`;
}

function card(r) {
  const ls = llmState(r);
  const p = (STATE.probe?.results || []).find(x => x.id === r.agentId);
  const pb = p ? VERDICT[p.verdict] : null;
  const bb = r.risk === 'unknown';
  const attention = r.risk === 'high' || ls.kind === 'hit' || (p && p.verdict === 'drift');
  const warnish = r.risk === 'medium' || (p && p.verdict === 'checker_error');

  const cls = attention ? 'attention' : warnish ? 'warnish' : (r.risk === 'unknown' ? 'dimmed' : '');
  const riskBadge = `<span class="badge b-${r.risk}">白盒 ${RISK_LABEL[r.risk] ?? r.risk}</span>`;
  const bbBadge = bb ? `<span class="badge b-bb">闭源</span>` : '';
  const pbBadge = pb ? `<span class="badge ${pb[0]}">黑盒 ${pb[1]}</span>` : '';
  // LLM 徽章:只在真有结论或有异常时出现,「未调用/未启用」不占头部
  const llmBadge = (ls.kind === 'hit' || ls.kind === 'clear' || ls.kind === 'err')
    ? `<span class="badge ${ls.kind === 'hit' ? 'b-llmhit' : ls.kind === 'err' ? 'b-err' : 'b-llmok'}">${ls.label}</span>`
    : '';

  const ver = r.version ? `v${esc(r.version)}` : '—';
  const when = r.publishedAt ? new Date(r.publishedAt).toLocaleDateString('zh-CN') : '';
  const bits = [ver, when];
  if (r.fallbackUsed && r.fallbackReason) bits.push(esc(r.fallbackReason));
  if (r.fetchError) bits.push(`<span style="color:var(--med)">${esc(r.fetchError)}</span>`);
  const link = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noreferrer">原文 ↗</a>` : '';

  const hits = (r.hits && r.hits.length)
    ? `<div class="hits">命中 ${r.hits.slice(0, 10).map(h => `<code>${esc(h)}</code>`).join('')}</div>` : '';
  const notes = r.notes ? `<div class="notes">${esc(r.notes.slice(0, 1200))}</div>` : '';
  const llm = llmBlock(r);
  const reason = r.risk === 'unknown' ? `<div class="act"><span class="hint">${esc(r.reason || '')}</span></div>` : '';

  const manual = r.risk === 'unknown' ? `
    <textarea id="m-${r.agentId}" style="display:none" placeholder="粘贴该 agent 的更新日志…"></textarea>
    <div class="act" style="margin-top:0;padding-top:0">
      <button onclick="showManual('${r.agentId}')">手动粘贴 changelog</button>
    </div>` : '';

  return `<div class="card ${cls}">
    <div class="rw">
      <div>
        <div class="name">${esc(r.agentId)} ${riskBadge} ${pbBadge} ${llmBadge} ${bbBadge}</div>
        <div class="meta">${bits.filter(Boolean).join('<span class="dot">·</span>')} ${link}</div>
      </div>
    </div>
    ${probeBar(r.agentId)}
    ${hits}${llm}${notes}${reason}${manual}
  </div>`;
}

function match(r) {
  const p = (STATE.probe?.results || []).find(x => x.id === r.agentId);
  const s = llmState(r);
  if (FILTER === 'all') return true;
  if (FILTER === 'attention') return r.risk === 'high' || r.risk === 'medium' || s.kind === 'hit' || (p && (p.verdict === 'drift' || p.verdict === 'checker_error'));
  if (FILTER === 'drift') return p && p.verdict === 'drift';
  if (FILTER === 'bb') return r.risk === 'unknown';
  if (FILTER === 'llm') return s.kind === 'hit' || s.kind === 'err';
  if (FILTER === 'absent') return p && (p.verdict === 'absent' || p.verdict === 'blackbox_only');
  return true;
}

function render() {
  const R = STATE.results || [];
  $('#sub').innerHTML = R.length
    ? `白盒最近抓取 <b>${esc((STATE.lastRunAt || '').slice(0, 16).replace('T', ' '))}</b> · ${R.length} 家 agent${STATE.error ? ' · <span style="color:var(--high)">错误:' + esc(STATE.error) + '</span>' : ''}`
    : '尚无数据,点「立即刷新」抓一轮';
  $('#probetime').textContent = STATE.probe?.checkedAt
    ? '黑盒上报于 ' + STATE.probe.checkedAt.slice(0, 16).replace('T', ' ') : '';
  void R;
  stats();
  $('#summary').innerHTML = summaryPanel();
  const list = R.filter(match);
  $('#list').innerHTML = list.length
    ? list.map(card).join('\n')
    : '<div class="empty">没有符合筛选条件的 agent</div>';
  document.querySelectorAll('#filters .chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.f === FILTER)));
}

function showManual(id) {
  const el = document.getElementById('m-' + id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (el.style.display === 'block') el.focus();
}

async function submitManual(id) {
  const el = document.getElementById('m-' + id);
  const notes = el.value.trim();
  if (!notes) return alert('请先粘贴内容');
  const r = await fetch(U('/api/manual'), { method: 'POST', headers: H, body: JSON.stringify({ agentId: id, notes }) });
  if (r.ok) load(); else alert('提交失败');
}

document.querySelectorAll('#filters .chip').forEach(c => {
  c.onclick = () => { FILTER = c.dataset.f; render() };
});

$('#refresh').onclick = async () => {
  const b = $('#refresh');
  b.disabled = true; b.textContent = '抓取中…';
  // 必须看状态码。服务端在「已有抓取在进行」时回 409(旧实现回 200 + 一份旧数据),
  // 这里若不判断,就会把陈旧数据当成本次刷新成功展示 —— 看起来一切正常,其实根本没刷新。
  try {
    const res = await fetch(U('/api/refresh'), { method: 'POST', headers: H });
    if (res.status === 409) {
      b.textContent = '已有抓取在进行';
    } else if (res.status === 202) {
      // 服务端立刻回执、抓取在后台跑(一次要串行 12 家 + 可能多次 LLM,可达几分钟)。
      // 这里轮询到 running=false 为止 —— **不能只 await 那个 POST**:
      // 几分钟后连接多半被中间层掐掉,页面会报「刷新失败」而抓取其实成功了,
      // 那种「成功看起来像失败」最难判断。
      b.textContent = '抓取中…';
      for (let i = 0; i < 300; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        const s = await fetch(U('/api/state'), { headers: H }).then((x) => x.json()).catch(() => null);
        if (!s) continue;              // 单次轮询失败就再试,别把整轮判死
        if (!s.running) { b.textContent = '立即刷新'; break; }
      }
    } else {
      b.textContent = res.ok ? '立即刷新' : '刷新失败';
    }
  } catch {
    b.textContent = '连接失败';
  }
  await load();
  b.disabled = false;
  if (b.textContent !== '立即刷新') setTimeout(() => { b.textContent = '立即刷新'; }, 2500);
};

load();
</script>
</body>
</html>
