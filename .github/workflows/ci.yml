name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # typecheck + tests + renderer/main build on both Windows and Linux.
  ci:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # package on main pushes (build artifact) and on v* tags (auto-publish the
  # GitHub Release with exe/AppImage/deb/tar.gz via electron-builder publish)
  package:
    needs: ci
    permissions:
      contents: write
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # the packaged app runs under Electron's ABI, not node's
      - run: npx electron-rebuild
      - name: Build and package (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --win

      - name: Build and package (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --linux

      - name: Upload installer artifact (Windows)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: MemorySQL-Windows-${{ github.sha }}
          path: |
            dist/MemorySQL-Setup-*.exe
            dist/MemorySQL-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Upload installer artifact (Linux)
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: MemorySQL-Linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/latest-linux.yml
          if-no-files-found: warn
