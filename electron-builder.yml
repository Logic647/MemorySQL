# electron-builder 配置 — MemorySQL Windows 打包
appId: org.memorysql.app
productName: MemorySQL
directories:
  buildResources: build
  output: dist

# ⚠ files 必须写在 win/mac/linux 段里各写一份,**根目录不能放 files** ——
# 实测踩坑(2026-10-08):根 files 与平台 files 并存时,electron-builder 把根 files
# 规范化成 {filter:[...]} FileSet 推入独立 matcher,而平台 files 字符串进 defaultMatcher
# 并被 unshift 到 matchers[0];getMainFileMatchers 见 matchers[0] 只有排除项
# (containsOnlyIgnore)就自动补 `**/*` → 整个仓库(含 data/ 184MB)打进 asar。
# 另两条写法约束:
#   1. 排除 node_modules 内文件的模式必须**相对包根**(`**/deps/**`);
#      写 `**/node_modules/<pkg>/deps/**` 对包内文件不生效 ——
#      getNodeModuleFileMatcher 把 `!` 排除挂到 per-dep matcher,其 from = 包根。
#   2. electron-builder 只对配置里出现的 `!` 排除做 node_modules 侧收集,
#      正向模式(out/** 等)留在平台 files 里供主拷贝用。
#
# 只保留中文 + 英文语言包(55 个 .pak → 2 个,-47MB)。放在根级对三平台都生效
# (electronLanguages: platformSpecificBuildOptions.electronLanguages || config.*)。
# 代价:其他语言的 Chromium 内建 UI(右键菜单等)回落英文;应用自身文案不受影响。
electronLanguages:
  - zh-CN
  - en-US

# 原生模块不能从 asar 内加载(better-sqlite3 + 语义检索三件套:
# onnxruntime-node 推理库、sqlite-vec 的 vec0.dll、tokenizers 的 .node)
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/sqlite-vec-*/**"
  - "**/node_modules/@anush008/tokenizers/**"

# agent stdio 桥脚本 → 安装后位于 resources/mcp-bridge.mjs;托盘图标 → resources/icon.png
extraResources:
  - from: scripts/mcp-bridge.mjs
    to: mcp-bridge.mjs
  - from: build/icon.png
    to: icon.png

# 当前 node_modules 里的 better-sqlite3 已经是 electron ABI(electron-rebuild 完成),
# 关闭重复重建以避免构建期再下载工具链
npmRebuild: false

# 自动更新:electron-updater 读 GitHub Releases 的 latest.yml;
# NSIS 差分更新靠 .exe.blockmap。发版流程见 docs/RELEASE.md
publish:
  provider: github

win:
  icon: build/icon.ico
  # files: 每平台完整清单(正向 out/** 与排除项同列,根 files 见文件头注释)。
  # 轻量化:onnxruntime-node 一个包装了 6 个平台的二进制(207.8MB),win 构建只用 win32/x64;
  # better-sqlite3 的 8 平台 prebuilds 同理只用 win32-x64;deps/ 是 SQLite C 源码(9.8MB)。
  # ⚠ 若将来启用 GPU/DML 推理,删掉 DirectML.dll 那行(fastembed 现默认 CPU EP,
  #   已实测:移除 DirectML.dll 后 bge-small-zh CPU 推理照常)。
  files:
    - out/**
    - "!**/.vite"
    - "!**/deps/**"
    - "!**/bin/napi-v3/{darwin,linux}/**"
    - "!**/bin/napi-v3/win32/arm64/**"
    - "!**/bin/napi-v3/win32/x64/DirectML.dll"
    - "!**/prebuilds/{darwin-*,linux*,win32-arm64}.node"
  target:
    - target: nsis
    - target: dir

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: MemorySQL-Setup-${version}.${ext}
  shortcutName: MemorySQL

linux:
  icon: build/icon.png
  category: Development
  maintainer: Logic647
  # 轻量化:同 win —— 只留 linux 二进制。CI 仅 x64 runner,arm64 一并排除;
  # ⚠ 若新增 linux/arm64 构建 job,删掉下面两处 arm64 行。
  files:
    - out/**
    - "!**/.vite"
    - "!**/deps/**"
    - "!**/bin/napi-v3/{win32,darwin}/**"
    - "!**/bin/napi-v3/linux/arm64/**"
    - "!**/prebuilds/{darwin-*,win32*,linux-arm64,linuxmusl-arm64}.node"
  target:
    - target: AppImage
    - target: deb
    - target: tar.gz

# ── macOS ────────────────────────────────────────────────────────────────────
# 图标:不指定 .icns,electron-builder 会从 build/icon.png 自动生成。
# 该 PNG 原本只有 256x256,而自动转换要求 >=512,故已放大到 1024x1024
# (HighQualityBicubic + 一次轻量 unsharp mask 找回边缘锐度)。
# 换源图时注意尺寸,别再退回 256。
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  darkModeSupport: true
  # 轻量化:只留 darwin 二进制。两个 darwin arch 都保留 —— CI 两个 runner 各自
  # `--arm64`/`--x64` 单架构构建,单份 yml 表达不了「排除另一 arch」(无反向宏),
  # 多留 ~34MB 可接受。
  files:
    - out/**
    - "!**/.vite"
    - "!**/deps/**"
    - "!**/bin/napi-v3/{win32,linux}/**"
    - "!**/prebuilds/{linux*,win32*}.node"
  # 未签名:没有 Apple Developer ID 就签不了。CI 上把 identity 显式置 null,
  # 免得 electron-builder 去翻钥匙串里不存在的证书。
  # 代价是首次启动 Gatekeeper 会拦,用户需「右键 -> 打开」或
  #   xattr -dr com.apple.quarantine /Applications/MemorySQL.app
  # 这条已写进 README 与发版说明。要正式签名见 docs/RELEASE.md。
  identity: null
  target:
    # dmg 给人装;zip 是 electron-updater 在 macOS 上的更新载体 ——
    # 少了 zip,mac 用户装上之后再也不会收到自动更新。
    - target: dmg
    - target: zip
  artifactName: MemorySQL-${version}-${arch}.${ext}
